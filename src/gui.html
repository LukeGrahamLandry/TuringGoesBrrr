<style>
    canvas {
        border: 4px solid black;
        margin-top: 5px;
    }
</style>

<input type="file" onchange="openTCfile()" id="tcfile">
<a id="canvasdownloadlink" download="circuit.png"><button> Download Image </button></a>
<button onclick="clearCanvas()">Clear</button>
<br><button onclick="importBase64TC()"> Import base64 </button> <button onclick="exportBase64TC()"> Export base64 </button>

<br> <canvas id="myCanvas" width="500" height="500"> <br>



<script src="../out/lib/snappyjs.js"></script>
<script>
    function compress(input){
        return SnappyJS.compress(new Uint8Array(input));
    }
    function uncompress(input){
        return SnappyJS.uncompress(new Uint8Array(input), Number.MAX_SAFE_INTEGER);
    }
</script>
<script src="../out/lib/save_monger.js"></script>
<script src="../out/evaluate.js"></script>
<script>
    const base64ToUint8 = (str) => Uint8Array.from(atob(str), (c) => c.charCodeAt(0));
    const uint8ToBase64 = (arr) => btoa(Array(arr.length).fill('').map((_, i) => String.fromCharCode(arr[i])).join(''));

    if (window.localStorage.getItem("turingcompletegamesave") != null){
        console.log("Restoring circuit from local storage!")
        parseCircuit(base64ToUint8(window.localStorage.getItem("turingcompletegamesave")));
    }

    function openTCfile(){
        var file = document.getElementById("tcfile").files[0];
        var reader = new FileReader();
        reader.onload = function(readerEvt) {
            let circuitData = new Uint8Array(readerEvt.target.result);
            console.log("Clearing Circuit!")
            console.log(window.localStorage.getItem("turingcompletegamesave"));
            parseCircuit(circuitData);
            window.localStorage.setItem("turingcompletegamesave", uint8ToBase64(circuitData));
        }
        reader.readAsArrayBuffer(file);
    }

    function parseCircuit(circuitData){
        let circuit = parse_state(circuitData);
        function fixSign(point){
            point.x = -(point.x < 2**15 ? point.x : (point.x-(2**16)))
            point.y = -(point.y < 2**15 ? point.y : (point.y-(2**16)))
        }
        fixSign(circuit.camera_position);
        circuit.components.forEach(element => {
            fixSign(element.position);
        });


        // the binary save format stores the wire points in terms of directions from the previous point
        // but their coordinate system is different like right/left and up/down are flipped
        // so this recomputes the directions, translates them to the html canvas coordinate system, then recomputes the positions
        circuit.wires.forEach(element => {
            let lastPoint = undefined;
            let newLastPoint = undefined;
            let newPoints = [];
            element.path.forEach(point => {
                fixSign(point);
                if (lastPoint != undefined){
                    let direction = {
                        x: -(point.x - lastPoint.x),
                        y: -(point.y - lastPoint.y)
                    }
                    
                    newPoints.push({
                        x: (newLastPoint.x + direction.x),
                        y: (newLastPoint.y + direction.y)
                    });
                    lastPoint = point;;
                    newLastPoint = newPoints[newPoints.length - 1];
                } else {
                    newPoints.push(point);
                    lastPoint = point;
                    newLastPoint = point;
                }
            });
            element.path = newPoints;
        });

        drawCircuit(circuit);
        console.log("Loaded Circuit!");
        console.log(circuit);
    }

    function drawCircuit(circuit){
        var c = document.getElementById("myCanvas");
        var ctx = c.getContext("2d");
        ctx.clearRect(0, 0, c.width, c.height);

        let scale = 10;
        let xOffset = 150;
        let yOffset = 250;

        circuit.components.forEach(element => {
            ctx.strokeStyle = "black";
            ctx.beginPath();
            ctx.arc(element.position.x * scale + xOffset, element.position.y * scale + yOffset, 10, 0, 2 * Math.PI);
            ctx.stroke();

            ctx.strokeStyle = "magenta";
            ctx.fillStyle = "magenta";
            ctx.font = "15px Arial";
            ctx.fillText(element.kind, element.position.x * scale + xOffset - (element.kind > 99 ? 13 : element.kind > 9 ? 8 : 4), element.position.y * scale + yOffset + 5);
        });

        let wireColors = ["orange", "black","black","cyan","black","black","black","purple","black","black","grey","black","black"]

        circuit.wires.forEach(wire => {
            ctx.strokeStyle = wireColors[wire.color];

            ctx.beginPath();
            
            ctx.moveTo(wire.path[0].x * scale + xOffset, wire.path[0].y * scale + yOffset);
            let skip = true;
            wire.path.forEach(point => {
                if (!skip){
                    ctx.lineTo(point.x * scale + xOffset, point.y * scale + yOffset);
                } else {
                    skip = false;
                }
            });
            ctx.stroke();
            

            wire.path.forEach(point => {
                ctx.beginPath();
                ctx.arc(point.x * scale + xOffset, point.y * scale + yOffset, 3, 0, 2 * Math.PI);
                ctx.stroke();
            });
        });
    }

    function downloadCanvasImage() {
        var c = document.getElementById("myCanvas");
        var dt = c.toDataURL('image/png');
        this.href = dt.replace(/^data:image\/[^;]/, 'data:application/octet-stream');
    };
    document.getElementById("canvasdownloadlink").addEventListener('click', downloadCanvasImage, false);

    function clearCanvas(){
        var c = document.getElementById("myCanvas");
        var ctx = c.getContext("2d");
        ctx.clearRect(0, 0, c.width, c.height);
        console.log("Clearing Circuit!")
        console.log(window.localStorage.getItem("turingcompletegamesave"));
        window.localStorage.removeItem("turingcompletegamesave");
    }

    function importBase64TC(){
        let encoded = prompt("Paste a base64 encoded Turing Complete circuit save file. ");
        if (encoded == null || encoded == "") return;

        console.log("Clearing Circuit!")
        console.log(window.localStorage.getItem("turingcompletegamesave"));
        parseCircuit(base64ToUint8(encoded));
        window.localStorage.setItem("turingcompletegamesave", encoded);
    }

    function exportBase64TC(){
        prompt("Copy this base64 string. It represents a Turing Complete circuit save file.", window.localStorage.getItem("turingcompletegamesave"))
    }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <title> TuringGoesBrrr </title>
    <link rel="manifest" href="/app.webmanifest"/>
    <link rel="canonical" href="https://turinggoesbrrr.com/circuit">
    <style>
        canvas {
            border: 4px solid black;
            margin-top: 5px;
        }

        body {
            background-color: #1a1a1a;
            color: #c3c7cd;
            text-align: center;
        }
    </style>
    <script defer data-domain="turinggoesbrrr.com" src="https://plausible.turinggoesbrrr.com/js/plausible.js"></script>
</head>
<body>
    <select id="contextSelect">
        <option value="/circuit" selected>Logic Circuit</option>
        <option value="/life">Conway's Game of Life</option>
        <option value="/esolangs">Esolangs</option>
    </select>

    <!-- Import, Export, Edit, Run, About -->

    <input type="file" id="turingCompleteGameFileInput"> <input type="file" id="logisimFileInput"> <br>
    <a id="canvasdownloadlink" download="circuit.png"><button> Download Image </button></a>
    <button id="clearCanvasButton">Clear</button> <button id="fitToScreenButton">Fit To Screen</button>
    <br><button id="importBase64Button"> Import base64 </button> <button id="exportBase64Button"> Export base64 </button> <br>
    <button id="changeSettingsButton"> Edit Settings </button> <button id="runTestsButton"> Run Unit Tests </button> <button id="loadExampleButton">Load Example Circuit</button>

    <br> <canvas id="myCanvas" width="500" height="500"></canvas> <br>

    <div id="bottom">
        <button id="installPWA" hidden style="cursor: pointer;"> Want to use TuringGoesBrrr offline? Click to install as progressive web app. </button>
    </div>
    
    <div style="position: fixed; bottom: 5px; right: 5px">
        <a href="" id="versionhash" target="_blank" style="color: white;"></a>
    </div>

    <script src="lib/snappyjs.min.js"></script>
    <script>
        function compress(input){
            return SnappyJS.compress(new Uint8Array(input));
        }
        function uncompress(input){
            return SnappyJS.uncompress(new Uint8Array(input), Number.MAX_SAFE_INTEGER);
        }

        window.SaveMonger = {
            component_kinds: {}
        };
        window.TuringGoesBrrr = {}
    </script>
    <script src="lib/tc_components.js"></script>
    <script src="lib/save_monger.min.js"></script>
    <script>
        let inverted = {}
        for (name in window.SaveMonger.component_kinds){
            let value = window.SaveMonger.component_kinds[name];
            inverted[value] = name;
        }
        window.SaveMonger.component_kinds = inverted;
    </script>
    <script src="circuit.js"></script>
</body>
</html>
